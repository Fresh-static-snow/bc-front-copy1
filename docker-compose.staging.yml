services:
  maincast-calendar-front:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maincast-calendar-front
    restart: unless-stopped
    tty: true
    stdin_open: true
    volumes:
      - ./:/app
      - front-node-modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    env_file:
      - ./.env
    network_mode: host

volumes:
  front-node-modules:
