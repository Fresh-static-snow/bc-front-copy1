name: Staging

on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Extract repository name and owner, and convert to lowercase
        id: extract_repo
        run: |
          echo "::set-output name=repo_name::$(echo ${{ github.repository }} | cut -d'/' -f2 | tr '[:upper:]' '[:lower:]')"
          echo "::set-output name=repo_owner::$(echo ${{ github.repository }} | cut -d'/' -f1 | tr '[:upper:]' '[:lower:]')"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.extract_repo.outputs.repo_owner }}/${{ steps.extract_repo.outputs.repo_name }}:latest
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_WEBSOCKET_BASE_URL=${{ secrets.VITE_WEBSOCKET_BASE_URL }}

      - name: Log out from GitHub Container Registry
        run: docker logout ghcr.io

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh -T -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} <<-EOF
            sudo docker pull ghcr.io/${{ steps.extract_repo.outputs.repo_owner }}/${{ steps.extract_repo.outputs.repo_name }}:latest
            sudo docker stop ${{ steps.extract_repo.outputs.repo_name }} || true
            sudo docker rm ${{ steps.extract_repo.outputs.repo_name }} || true
            sudo docker run -d --name ${{ steps.extract_repo.outputs.repo_name }} \
              --network host \
              -e VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }} \
              -e VITE_WEBSOCKET_BASE_URL=${{ secrets.VITE_WEBSOCKET_BASE_URL }} \
              ghcr.io/${{ steps.extract_repo.outputs.repo_owner }}/${{ steps.extract_repo.outputs.repo_name }}:latest
          EOF