name: Staging

on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_WEBSOCKET_BASE_URL=${{ secrets.VITE_WEBSOCKET_BASE_URL }}

      - name: Log out from GitHub Container Registry
        run: docker logout ghcr.io

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh -T -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} <<-EOF
            eval `ssh-agent -s`
            ssh-add ~/.ssh/${{ secrets.SSH_ID_RSA_NAME}}

            docker pull ghcr.io/${{ github.repository }}:latest
            docker stop maincast-calendar-front || true
            docker rm maincast-calendar-front || true
            docker run -d --name maincast-calendar-front \
              -e VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }} \
              -e VITE_WEBSOCKET_BASE_URL=${{ secrets.VITE_WEBSOCKET_BASE_URL }} \
              -p 9000:9000 \
              ghcr.io/${{ github.repository }}:latest
          EOF