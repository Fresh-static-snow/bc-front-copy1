name: Staging

on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - staging

permissions: write-all

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set variables
        id: vars
        run: |
          echo "repository_name_lowercase=$(echo ${{ github.repository }} | cut -d'/' -f2 | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "repository_owner_lowercase=$(echo ${{ github.repository }} | cut -d'/' -f1 | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "server_folder_path=/home/${{ secrets.SSH_USER }}/next-front-copy1" >> $GITHUB_ENV
          echo "docker_compose_file=docker-compose.staging.yml" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.repository_owner_lowercase }}/${{ env.repository_name_lowercase }}:latest

      - name: Log out from GitHub Container Registry
        run: docker logout ghcr.io

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Create project folder
        run: |
          ssh -T -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} <<-EOF
            if [ ! -d "${{ env.server_folder_path }}" ]; then
              sudo mkdir ${{ env.server_folder_path }}
              sudo chown ${{ secrets.SSH_USER }}:${{ secrets.SSH_USER }} ${{ env.server_folder_path }}
            fi
          EOF
  
      - name: Copy docker-compose.yml
        run: |
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ env.docker_compose_file }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.server_folder_path }}
 
      - name: Create .env
        run: |
          ssh -T -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} <<-EOF
            echo "
            REPOSITORY_OWNER_LOWERCASE='${{ env.repository_owner_lowercase }}'
            REPOSITORY_NAME_LOWERCASE='${{ env.repository_name_lowercase }}'
            VITE_API_BASE_URL='${{ secrets.VITE_API_BASE_URL }}'
            VITE_WEBSOCKET_BASE_URL='${{ secrets.VITE_WEBSOCKET_BASE_URL }}'
            VITE_ENVIRONMENT='staging'
            VITE_TELEGRAM_BOT_URL='https://t.me/my_bot'
            VITE_SENTRY_DSN='https://examplePublicKey@o0.ingest.sentry.io/0'
            VITE_SENTRY_PROPAGATION_TARGETS='domain.url.com, localhost, /^https:\/\/yourserver\.io\/api/'
            " > ${{ env.server_folder_path }}/.env
          EOF

      - name: Run Docker
        run: |
          ssh -T -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} <<-EOF
            cd ${{ env.server_folder_path }}
            echo "${{ github.token }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            sudo docker pull ghcr.io/${{ env.repository_owner_lowercase }}/${{ env.repository_name_lowercase }}:latest
            sudo docker stop maincast-calendar-front || true
            sudo docker rm maincast-calendar-front || true
            sudo docker compose -f ${{ env.docker_compose_file }} up -d
          EOF