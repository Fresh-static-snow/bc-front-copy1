name: Staging

on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - staging
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BC_DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 195.201.193.151 >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh -T -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null crmtools@195.201.193.151 <<-EOF
            eval `ssh-agent -s`
            ssh-add ~/.ssh/id_rsa_front
            if [ ! -d "/home/crmtools/next-front-copy1" ]; then
              mkdir /home/crmtools/next-front-copy1
              chown crmtools:crmtools /home/crmtools/next-front-copy1
              git clone git@github-front:masterwebcompany/broadcast-shift-calendar-front.git /home/crmtools/next-front-copy1
            fi
            cd /home/crmtools/next-front-copy1
            git checkout staging
            git pull origin staging

            export VITE_API_BASE_URL="https://next-api-crm-copy1.maincast.com/api/v1"
            export VITE_WEBSOCKET_BASE_URL="wss://next-api-crm-copy1.maincast.com/cable"

            echo "
            VITE_API_BASE_URL='https://next-api-crm-copy1.maincast.com/api/v1'
            VITE_WEBSOCKET_BASE_URL='wss://next-api-crm-copy1.maincast.com/cable'
            " > /home/crmtools/next-front-copy1/.env
            pnpm install
            pnpm run build

          EOF
